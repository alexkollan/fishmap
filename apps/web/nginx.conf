server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service worker and manifest must never be cached, everything else
    # under /assets is content-hashed and safe to cache long-term.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
