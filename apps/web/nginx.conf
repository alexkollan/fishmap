server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service worker and manifest must never be cached, everything else
    # under /assets is content-hashed and safe to cache long-term.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx:1.27-alpine's stock mime.types has no .mjs entry, so it falls
    # back to application/octet-stream — browsers enforce strict MIME
    # checking on module scripts/workers and refuse to execute those (see
    # public/vendor/README.md for the maplibre-gl worker files this broke).
    # default_type only kicks in when the extension isn't otherwise mapped,
    # so this doesn't touch the .js/.css/etc mappings from mime.types.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # No path suffix on purpose: nginx forwards the matched URI (including
    # /api/...) unchanged to the api container on the compose network.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
